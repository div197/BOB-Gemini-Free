services:
  bob-gemini-free:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bob-gemini-free
    environment:
      - BOB_GEMINI_FREE_HOST=0.0.0.0
      - BOB_GEMINI_FREE_PORT=8081
    ports:
      - "8081:8081"
    volumes:
      - ./config.json:/app/config.json:ro
      - ./cookie.txt:/app/cookie.txt:ro
    restart: unless-stopped
