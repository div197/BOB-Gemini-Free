<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BOB Gemini Free — Universal AI Gateway</title>
<style>
:root {
  --bg-primary: #0a0e17;
  --bg-card: #121826;
  --bg-input: #1a2234;
  --border: #26334d;
  --accent-cyan: #00f0ff;
  --accent-blue: #3b82f6;
  --accent-purple: #a855f7;
  --accent-green: #10b981;
  --text-primary: #f1f5f9;
  --text-secondary: #94a3b8;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  line-height: 1.5;
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}
header {
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  padding: 10px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  z-index: 10;
}
.brand { display: flex; align-items: center; gap: 10px; }
.logo {
  font-weight: 800;
  font-size: 1.15rem;
  letter-spacing: 0.5px;
  background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.badge {
  font-size: 0.7rem;
  background: rgba(0, 240, 255, 0.1);
  color: var(--accent-cyan);
  border: 1px solid rgba(0, 240, 255, 0.3);
  padding: 2px 8px;
  border-radius: 9999px;
  font-weight: 600;
}
.telemetry {
  display: flex;
  gap: 12px;
  font-size: 0.78rem;
  color: var(--text-secondary);
  flex-wrap: wrap;
}
.telemetry span b { color: var(--accent-cyan); }
.header-actions { display: flex; gap: 8px; align-items: center; }

main {
  flex: 1;
  display: grid;
  grid-template-columns: 300px 1fr 340px;
  overflow: hidden;
  position: relative;
}

.sidebar-left, .sidebar-right {
  background: var(--bg-card);
  padding: 16px;
  overflow-y: auto;
  border-right: 1px solid var(--border);
}
.sidebar-right { border-right: none; border-left: 1px solid var(--border); }
.section-title {
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-secondary);
  margin-bottom: 12px;
  font-weight: 700;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.control-group { margin-bottom: 14px; }
label { display: block; font-size: 0.78rem; color: var(--text-secondary); margin-bottom: 5px; }
select, input, textarea {
  width: 100%;
  background: var(--bg-input);
  border: 1px solid var(--border);
  color: var(--text-primary);
  padding: 8px 10px;
  border-radius: 6px;
  font-size: 0.85rem;
  outline: none;
  font-family: inherit;
}
select:focus, input:focus, textarea:focus { border-color: var(--accent-cyan); }

.chat-container {
  display: flex;
  flex-direction: column;
  height: 100%;
  background: var(--bg-primary);
  position: relative;
  overflow: hidden;
}
.chat-toolbar {
  padding: 8px 16px;
  background: rgba(18, 24, 38, 0.7);
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.75rem;
  color: var(--text-secondary);
}
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.msg {
  max-width: 88%;
  padding: 12px 16px;
  border-radius: 8px;
  font-size: 0.92rem;
  line-height: 1.6;
  position: relative;
  word-break: break-word;
  overflow-wrap: break-word;
}
.msg-user {
  background: #1e293b;
  align-self: flex-end;
  border: 1px solid #334155;
  white-space: pre-wrap;
}
.msg-assistant {
  background: var(--bg-card);
  align-self: flex-start;
  border: 1px solid var(--border);
  width: 100%;
  max-width: 95%;
}
.msg-actions {
  display: flex;
  gap: 8px;
  margin-top: 8px;
  padding-top: 6px;
  border-top: 1px solid rgba(255, 255, 255, 0.05);
}
.mini-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-secondary);
  font-size: 0.7rem;
  padding: 2px 6px;
  border-radius: 4px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.mini-btn:hover { color: var(--text-primary); border-color: var(--text-secondary); }

.thought-box {
  background: #0b1120;
  border-left: 3px solid var(--accent-purple);
  padding: 10px 12px;
  margin-bottom: 12px;
  border-radius: 4px;
  font-size: 0.82rem;
  color: #cbd5e1;
  font-family: var(--font-mono);
  white-space: pre-wrap;
  display: none;
  max-height: 250px;
  overflow-y: auto;
}
.thought-box.active { display: block; }
.thought-header {
  color: var(--accent-purple);
  font-weight: 700;
  font-size: 0.72rem;
  text-transform: uppercase;
  margin-bottom: 4px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
}

.input-container {
  padding: 12px 16px;
  background: var(--bg-card);
  border-top: 1px solid var(--border);
  display: flex;
  gap: 10px;
  align-items: flex-end;
}
#user-input {
  flex: 1;
  min-height: 42px;
  max-height: 180px;
  resize: none;
  line-height: 1.4;
  padding: 10px 12px;
}
.btn {
  background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
  color: #000;
  font-weight: 700;
  border: none;
  padding: 10px 18px;
  border-radius: 6px;
  cursor: pointer;
  transition: opacity 0.2s;
  height: 42px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 0.85rem;
}
.btn:hover { opacity: 0.9; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

.snippet-box {
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px;
  font-family: var(--font-mono);
  font-size: 0.72rem;
  color: #a5f3fc;
  overflow-x: auto;
  white-space: pre;
  margin-bottom: 12px;
}

/* Zero-dependency Markdown Styles */
.markdown-body pre {
  background: #0b1120;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px;
  margin: 10px 0;
  overflow-x: auto;
  position: relative;
  font-family: var(--font-mono);
  font-size: 0.82rem;
}
.markdown-body code {
  background: rgba(0, 240, 255, 0.08);
  color: var(--accent-cyan);
  padding: 2px 5px;
  border-radius: 4px;
  font-family: var(--font-mono);
  font-size: 0.85em;
}
.markdown-body pre code {
  background: transparent;
  color: #e2e8f0;
  padding: 0;
}
.code-block-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.7rem;
  color: var(--text-secondary);
  margin-bottom: 6px;
  padding-bottom: 4px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}
.markdown-body p { margin-bottom: 8px; }
.markdown-body p:last-child { margin-bottom: 0; }
.markdown-body ul, .markdown-body ol { margin: 8px 0 8px 20px; }
.markdown-body li { margin-bottom: 4px; }

/* Responsive Drawer for Mobile */
.mobile-tabs { display: none; }
@media (max-width: 900px) {
  header { padding: 8px 12px; }
  .telemetry { display: none; }
  main { grid-template-columns: 1fr; }
  .sidebar-left, .sidebar-right { display: none; position: absolute; inset: 0; z-index: 20; }
  .sidebar-left.active, .sidebar-right.active { display: block; }
  .mobile-tabs { display: flex; gap: 6px; }
  .msg { max-width: 95%; }
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">⚡ BOB GEMINI FREE</div>
    <div class="badge">Universal AI Gateway</div>
  </div>
  <div class="telemetry">
    <span>Uptime: <b id="stat-uptime">0s</b></span>
    <span>Requests: <b id="stat-requests">0</b></span>
    <span>Tokens: <b id="stat-tokens">0</b></span>
    <span>Estimated Savings: <b id="stat-savings">$0.00</b></span>
  </div>
  <div class="mobile-tabs">
    <button class="mini-btn" onclick="toggleSidebar('left')">⚙️ Settings</button>
    <button class="mini-btn" onclick="toggleSidebar('right')">💻 Code</button>
  </div>
</header>

<main>
  <div class="sidebar-left" id="sidebar-left">
    <div class="section-title">
      <span>Model & Reasoning</span>
      <button class="mini-btn" style="display:none;" id="close-left-btn" onclick="toggleSidebar('left')">✕</button>
    </div>
    <div class="control-group">
      <label>Target Model</label>
      <select id="model-select" onchange="updateSnippet()">
        <option value="gemini-3.7-flash" selected>gemini-3.7-flash (Flagship Fast)</option>
        <option value="gemini-3.7-flash-thinking">gemini-3.7-flash-thinking (Deep Reasoning)</option>
        <option value="gemini-3.6-flash">gemini-3.6-flash</option>
        <option value="gemini-3.1-pro">gemini-3.1-pro (Pro Routing)</option>
        <option value="gemini-flash-lite">gemini-flash-lite (Ultra Fast)</option>
        <option value="imagen-3">imagen-3 (Image Synthesis)</option>
      </select>
    </div>
    <div class="control-group">
      <label>Reasoning Effort (@think)</label>
      <select id="think-select" onchange="updateSnippet()">
        <option value="default" selected>Model Default</option>
        <option value="@think=0">Deep Reasoning (@think=0)</option>
        <option value="@think=2">Medium Thinking (@think=2)</option>
        <option value="@think=4">Zero Thinking / Fast (@think=4)</option>
      </select>
    </div>
    <div class="control-group">
      <label>Protocol Endpoint</label>
      <select id="proto-select" onchange="updateSnippet()">
        <option value="openai" selected>OpenAI Standard (/v1/chat/completions)</option>
        <option value="anthropic">Anthropic Standard (/v1/messages)</option>
        <option value="google">Google Gemini (/v1beta/models/...)</option>
      </select>
    </div>
    <div class="control-group">
      <label>System Prompt (Optional)</label>
      <textarea id="system-prompt" rows="3" placeholder="You are a helpful AI assistant..."></textarea>
    </div>
  </div>

  <div class="chat-container">
    <div class="chat-toolbar">
      <span>💬 Local AI Session (100% On-Device / Zero Cloud Bill)</span>
      <div style="display:flex; gap:6px;">
        <button class="mini-btn" onclick="copyFullTranscript()">📋 Copy Chat</button>
        <button class="mini-btn" onclick="exportMarkdown()">💾 Export .md</button>
        <button class="mini-btn" onclick="clearChat()">🗑️ Clear</button>
      </div>
    </div>
    <div class="messages" id="messages-list"></div>
    <div class="input-container">
      <textarea id="user-input" placeholder="Type your message or paste large code... (Shift+Enter for newline, Enter to send)" rows="1" autofocus oninput="autoResize(this)" onkeydown="handleKeyDown(event)"></textarea>
      <button class="btn" id="send-btn" onclick="sendMessage()">Send</button>
    </div>
  </div>

  <div class="sidebar-right" id="sidebar-right">
    <div class="section-title">
      <span>Drop-in Integration Code</span>
      <button class="mini-btn" style="display:none;" id="close-right-btn" onclick="toggleSidebar('right')">✕</button>
    </div>
    
    <label>Python SDK (OpenAI)</label>
    <div class="snippet-box" id="code-python"></div>
    <button class="mini-btn" onclick="copySnippet('code-python')">Copy Python</button>

    <div style="height: 14px;"></div>

    <label>Claude Code CLI</label>
    <div class="snippet-box" id="code-claude"></div>
    <button class="mini-btn" onclick="copySnippet('code-claude')">Copy Claude Code</button>

    <div style="height: 14px;"></div>

    <label>cURL Stream</label>
    <div class="snippet-box" id="code-curl"></div>
    <button class="mini-btn" onclick="copySnippet('code-curl')">Copy cURL</button>
  </div>
</main>

<script>
let chatHistory = [];
const STORAGE_KEY = "bob_gemini_free_chat_history";

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 180) + 'px';
}

function handleKeyDown(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function toggleSidebar(side) {
  const el = document.getElementById('sidebar-' + side);
  const closeBtn = document.getElementById('close-' + side + '-btn');
  const isActive = el.classList.contains('active');
  document.querySelectorAll('.sidebar-left, .sidebar-right').forEach(s => s.classList.remove('active'));
  if (!isActive) {
    el.classList.add('active');
    if (closeBtn) closeBtn.style.display = 'inline';
  }
}

async function refreshTelemetry() {
  try {
    const res = await fetch("/");
    if (res.ok) {
      const data = await res.json();
      document.getElementById("stat-uptime").innerText = (data.uptime_seconds || 0) + "s";
      document.getElementById("stat-requests").innerText = data.requests_served || 0;
      document.getElementById("stat-tokens").innerText = (data.tokens_processed || 0).toLocaleString();
      document.getElementById("stat-savings").innerText = data.estimated_savings_usd || "$0.00";
    }
  } catch(e) {}
}
setInterval(refreshTelemetry, 2500);
refreshTelemetry();

function updateSnippet() {
  let model = document.getElementById("model-select").value;
  const thinkMod = document.getElementById("think-select").value;
  if (thinkMod !== "default") {
    model = model + thinkMod;
  }

  document.getElementById("code-python").innerText = 
`from openai import OpenAI
client = OpenAI(base_url="http://127.0.0.1:8081/v1", api_key="none")
res = client.chat.completions.create(
    model="${model}",
    messages=[{"role": "user", "content": "Hello!"}]
)
print(res.choices[0].message.content)`;

  document.getElementById("code-claude").innerText = 
`export ANTHROPIC_BASE_URL=http://127.0.0.1:8081
export ANTHROPIC_API_KEY=none
claude`;

  document.getElementById("code-curl").innerText = 
`curl http://127.0.0.1:8081/v1/chat/completions \\
  -H "Content-Type: application/json" \\
  -d '{"model":"${model}","stream":true,"messages":[{"role":"user","content":"Hi"}]}'`;
}
updateSnippet();

function copySnippet(id) {
  const text = document.getElementById(id).innerText;
  navigator.clipboard.writeText(text);
}

function escapeHtml(str) {
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function renderMarkdown(text) {
  if (!text) return "";
  let html = text;

  // Code blocks
  html = html.replace(/```([a-zA-Z0-9_-]*)\n([\s\S]*?)```/g, function(match, lang, code) {
    const safeCode = escapeHtml(code);
    const langLabel = lang || 'code';
    return '<pre><div class="code-block-header"><span>' + langLabel + '</span><button class="mini-btn" onclick="copyCode(this)">Copy Code</button></div><code>' + safeCode + '</code></pre>';
  });

  // Inline code
  html = html.replace(/`([^`]+)`/g, function(match, code) {
    return '<code>' + escapeHtml(code) + '</code>';
  });

  // Bold & Italic
  html = html.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  html = html.replace(/\*([^*]+)\*/g, '<i>$1</i>');

  // Line breaks in non-pre blocks
  const parts = html.split(/(<pre[\s\S]*?<\/pre>)/g);
  for (let i = 0; i < parts.length; i++) {
    if (!parts[i].startsWith('<pre')) {
      parts[i] = parts[i].replace(/\n/g, '<br>');
    }
  }
  return parts.join('');
}

function copyCode(btn) {
  const code = btn.closest('pre').querySelector('code').innerText;
  navigator.clipboard.writeText(code);
  const old = btn.innerText;
  btn.innerText = 'Copied!';
  setTimeout(() => btn.innerText = old, 1500);
}

function copyMessageText(btn) {
  const msgEl = btn.closest('.msg');
  const text = msgEl.getAttribute('data-raw') || msgEl.innerText;
  navigator.clipboard.writeText(text);
  const old = btn.innerText;
  btn.innerText = 'Copied!';
  setTimeout(() => btn.innerText = old, 1500);
}

function copyFullTranscript() {
  if (chatHistory.length === 0) return;
  const transcript = chatHistory.map(m => `### ${m.role === 'user' ? 'User' : 'Assistant'}:\n${m.content}\n`).join('\n---\n\n');
  navigator.clipboard.writeText(transcript);
  alert("Complete conversation copied to clipboard!");
}

function exportMarkdown() {
  if (chatHistory.length === 0) return;
  const transcript = "# BOB Gemini Free — Chat Export\n\n" + chatHistory.map(m => `### ${m.role === 'user' ? 'User' : 'Assistant'}:\n${m.content}\n`).join('\n---\n\n');
  const blob = new Blob([transcript], { type: 'text/markdown' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = "bob-gemini-chat-" + new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-") + ".md";
  a.click();
  URL.revokeObjectURL(url);
}

function clearChat() {
  if (confirm("Clear current chat history?")) {
    chatHistory = [];
    localStorage.removeItem(STORAGE_KEY);
    renderMessages();
  }
}

function saveHistory() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(chatHistory));
  } catch(e) {}
}

function loadHistory() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      chatHistory = JSON.parse(raw);
    }
  } catch(e) {}
  renderMessages();
}

function renderMessages() {
  const list = document.getElementById("messages-list");
  list.innerHTML = "";
  if (chatHistory.length === 0) {
    const welcome = document.createElement("div");
    welcome.className = "msg msg-assistant markdown-body";
    welcome.innerHTML = "👋 Welcome to <b>BOB Gemini Free</b>. All requests are translated locally to Google's internal web RPC. Zero cloud bill, zero credit card, 100% free. Type a message or paste code to start!";
    list.appendChild(welcome);
    return;
  }

  for (const m of chatHistory) {
    const div = document.createElement("div");
    div.className = m.role === 'user' ? 'msg msg-user' : 'msg msg-assistant markdown-body';
    div.setAttribute('data-raw', m.content);

    if (m.thought) {
      const tb = document.createElement("div");
      tb.className = "thought-box active";
      tb.innerHTML = '<div class="thought-header"><span>🧠 Reasoning Process</span></div>' + renderMarkdown(m.thought);
      div.appendChild(tb);
    }

    const contentDiv = document.createElement("div");
    contentDiv.innerHTML = m.role === 'user' ? escapeHtml(m.content) : renderMarkdown(m.content);
    div.appendChild(contentDiv);

    const actions = document.createElement("div");
    actions.className = "msg-actions";
    actions.innerHTML = '<button class="mini-btn" onclick="copyMessageText(this)">📋 Copy</button>';
    div.appendChild(actions);

    list.appendChild(div);
  }
  list.scrollTop = list.scrollHeight;
}

loadHistory();

async function sendMessage() {
  const inputEl = document.getElementById("user-input");
  const text = inputEl.value.trim();
  if (!text) return;

  const btn = document.getElementById("send-btn");
  inputEl.value = "";
  inputEl.style.height = '42px';
  inputEl.disabled = true;
  btn.disabled = true;

  const msgList = document.getElementById("messages-list");

  // User bubble
  const userDiv = document.createElement("div");
  userDiv.className = "msg msg-user";
  userDiv.setAttribute('data-raw', text);
  userDiv.innerText = text;
  msgList.appendChild(userDiv);

  chatHistory.push({role: "user", content: text});
  saveHistory();

  // Assistant bubble
  const asstDiv = document.createElement("div");
  asstDiv.className = "msg msg-assistant markdown-body";

  const thoughtBox = document.createElement("div");
  thoughtBox.className = "thought-box";
  thoughtBox.innerHTML = '<div class="thought-header"><span>🧠 Reasoning Process</span></div><div class="thought-content"></div>';
  asstDiv.appendChild(thoughtBox);

  const contentSpan = document.createElement("div");
  asstDiv.appendChild(contentSpan);

  const actions = document.createElement("div");
  actions.className = "msg-actions";
  actions.innerHTML = '<button class="mini-btn" onclick="copyMessageText(this)">📋 Copy</button>';
  asstDiv.appendChild(actions);

  msgList.appendChild(asstDiv);
  msgList.scrollTop = msgList.scrollHeight;

  let model = document.getElementById("model-select").value;
  const thinkMod = document.getElementById("think-select").value;
  if (thinkMod !== "default") {
    model = model + thinkMod;
  }

  const sysPrompt = document.getElementById("system-prompt").value.trim();
  const reqMessages = [];
  if (sysPrompt) {
    reqMessages.push({role: "system", content: sysPrompt});
  }
  for (const m of chatHistory) {
    reqMessages.push({role: m.role, content: m.content});
  }

  let asstFullText = "";
  let thoughtFullText = "";

  try {
    const res = await fetch("/v1/chat/completions", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        model: model,
        stream: true,
        messages: reqMessages
      })
    });

    if (!res.ok) {
      const errJson = await res.json();
      contentSpan.innerText = "Error: " + JSON.stringify(errJson);
      return;
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let partial = "";

    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      partial += decoder.decode(value, {stream: true});

      const lines = partial.split("\n");
      partial = lines.pop() || "";

      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed || trimmed === "data: [DONE]") continue;
        if (trimmed.startsWith("data: ")) {
          try {
            const data = JSON.parse(trimmed.slice(6));
            const delta = data.choices && data.choices[0] ? data.choices[0].delta : null;
            if (delta) {
              if (delta.reasoning_content) {
                thoughtBox.classList.add("active");
                thoughtFullText += delta.reasoning_content;
                thoughtBox.querySelector(".thought-content").innerHTML = renderMarkdown(thoughtFullText);
              }
              if (delta.content) {
                asstFullText += delta.content;
                contentSpan.innerHTML = renderMarkdown(asstFullText);
              }
            }
          } catch(e) {}
        }
      }
      msgList.scrollTop = msgList.scrollHeight;
    }

    asstDiv.setAttribute('data-raw', asstFullText);
    chatHistory.push({role: "assistant", content: asstFullText, thought: thoughtFullText});
    saveHistory();
  } catch(err) {
    contentSpan.innerText = "Connection error: " + err.message;
  } finally {
    inputEl.disabled = false;
    btn.disabled = false;
    inputEl.focus();
    refreshTelemetry();
  }
}
</script>
</body>
</html>
