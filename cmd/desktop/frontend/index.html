<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="theme-color" content="#07111f"/>
    <title>BOB Gemini Free</title>
    <style>
        :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: #f8fafc; background: radial-gradient(circle at 50% 34%, #102b4a 0%, #07111f 42%, #030711 100%); }
        body.ready { display: block; background: #030711; }
        .shell { width: min(440px, calc(100vw - 48px)); padding: 42px 38px 34px; text-align: center; border: 1px solid rgba(148, 163, 184, .2); border-radius: 28px; background: rgba(7, 17, 31, .82); box-shadow: 0 26px 80px rgba(0, 0, 0, .45), 0 0 45px rgba(56, 189, 248, .1); backdrop-filter: blur(20px); }
        .gateway-frame { display: block; width: 100%; height: 100vh; min-height: 100vh; border: 0; background: #030711; }
        .gateway-frame[hidden] { display: none; }
        .mark { width: 96px; height: 96px; margin: 0 auto 24px; display: grid; place-items: center; border-radius: 26px; background: linear-gradient(145deg, #172b48, #050a14); box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 0 34px rgba(34, 211, 238, .2); }
        .mark img { width: 100%; height: 100%; object-fit: cover; border-radius: 24px; }
        h1 { margin: 0; font-size: 1.38rem; letter-spacing: -.02em; }
        .eyebrow { margin: 8px 0 28px; color: #94a3b8; font-size: .8rem; letter-spacing: .11em; text-transform: uppercase; }
        .status-row { display: inline-flex; align-items: center; gap: 10px; color: #cbd5e1; font-size: .95rem; }
        .loader { width: 16px; height: 16px; border: 2px solid rgba(148,163,184,.28); border-top-color: #22d3ee; border-radius: 50%; animation: spin .9s linear infinite; }
        .error { margin-top: 20px; padding: 14px 16px; text-align: left; color: #fecaca; border: 1px solid rgba(248,113,113,.35); border-radius: 14px; background: rgba(127,29,29,.2); font-size: .87rem; line-height: 1.45; overflow-wrap: anywhere; }
        .retry { margin-top: 18px; padding: 10px 16px; border: 1px solid rgba(125,211,252,.4); border-radius: 999px; color: #cffafe; background: rgba(8,47,73,.7); cursor: pointer; font: inherit; }
        .retry:hover { background: rgba(14,116,144,.45); }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <script type="module">
        import { BrowserOpenURL, EventsOn } from "/wailsjs/runtime/runtime.js";
        import { GatewayURL } from "/wailsjs/go/main/App.js";

        const shell = document.querySelector(".shell");
        const status = document.querySelector("[data-status]");
        const frame = document.querySelector("[data-gateway-frame]");
        let opened = false;
        let gatewayOrigin = "";
        const showGatewayError = (message) => {
            if (shell.querySelector(".error")) return;
            document.querySelector(".status-row")?.remove();
            const error = document.createElement("div");
            error.className = "error";
            error.textContent = message || "The desktop gateway could not start.";
            const retry = document.createElement("button");
            retry.className = "retry";
            retry.type = "button";
            retry.textContent = "Retry startup";
            retry.addEventListener("click", () => window.location.reload());
            shell.append(error, retry);
        };

        const openGateway = (endpoint) => {
            if (opened) return;
            let gateway;
            try {
                gateway = new URL(endpoint);
            } catch (_) {
                showGatewayError("The desktop gateway returned an invalid endpoint.");
                return;
            }
            if (gateway.protocol !== "http:" || !["127.0.0.1", "localhost"].includes(gateway.hostname)) {
                showGatewayError("The desktop gateway endpoint was outside the local device boundary.");
                return;
            }
            opened = true;
            gatewayOrigin = gateway.origin;
            status.textContent = "Opening your local workspace…";
            frame.src = `${gateway.origin}/playground?desktop_shell=1`;
        };

        frame.addEventListener("load", () => {
            frame.hidden = false;
            frame.classList.add("ready");
            shell.hidden = true;
            document.body.classList.add("ready");
        });

        // The loopback Studio cannot retain Wails' injected runtime after a
        // top-level navigation. Accept only messages from the exact gateway
        // frame/origin and only pass protocol-validated URLs to the native
        // default-browser bridge.
        window.addEventListener("message", (event) => {
            if (!frame || event.source !== frame.contentWindow || event.origin !== gatewayOrigin) return;
            const message = event.data;
            if (!message || message.type !== "BOB_OPEN_EXTERNAL_URL" || typeof message.url !== "string") return;
            let url;
            try {
                url = new URL(message.url);
            } catch (_) {
                return;
            }
            if (!["http:", "https:", "mailto:", "tel:"].includes(url.protocol)) return;
            try {
                BrowserOpenURL(url.href);
            } catch (_) {
                // The native bridge is expected to be available for this
                // shell. Do not fall back to a WebView navigation that could
                // replace the local workspace with an external page.
            }
        });

        EventsOn("gateway-ready", openGateway);
        EventsOn("gateway-error", showGatewayError);

        // OnStartup can emit before the WebView has registered EventsOn. The
        // bound method is the durable fallback for that one-shot event.
        GatewayURL().then(openGateway).catch(() => {
            showGatewayError("The desktop gateway bootstrap failed. Restart the app and try again.");
        });
    </script>
</head>
<body>
    <main class="shell" aria-live="polite">
        <div class="mark"><img src="assets/bob-gemini-free-icon.png" alt="BOB Gemini Free"/></div>
        <h1>BOB Gemini Free</h1>
        <p class="eyebrow">Local AI gateway studio</p>
        <div class="status-row"><span class="loader" aria-hidden="true"></span><span data-status>Starting your secure workspace…</span></div>
    </main>
    <iframe class="gateway-frame" data-gateway-frame title="BOB Gemini Free local workspace" hidden></iframe>
</body>
</html>
