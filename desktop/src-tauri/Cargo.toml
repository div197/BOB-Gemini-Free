[package]
name = "bob-gemini-free-desktop"
version = "0.1.7"
description = "Break Ordinary Boundaries"
authors = ["Divyanshu Singh Chouhan"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = [ "shell-sidecar", "shell-execute", "shell-open"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
