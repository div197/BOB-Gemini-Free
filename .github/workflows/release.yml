name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  verify:
    name: Release verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run hermetic tests
        run: go test -count=1 ./...

      - name: Run race tests
        run: go test -count=1 -race ./...

      - name: Run vet and build
        run: |
          go vet ./...
          go build ./...

  build-cli:
    name: Build CLI ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    env:
      UPDATE_PUBLIC_KEY: ${{ vars.BOB_GEMINI_FREE_UPDATE_PUBLIC_KEY }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Require release trust anchor
        shell: bash
        run: test -n "$UPDATE_PUBLIC_KEY"

      - name: Build signed-trust CLI binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          output="dist/bob-gemini-free-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            output="$output.exe"
          fi
          GOOS="${{ matrix.goos }}" GOARCH="${{ matrix.goarch }}" CGO_ENABLED=0 \
            go build -ldflags="-s -w -X github.com/div197/bob-gemini-free/internal/updater.BuildUpdatePublicKey=$UPDATE_PUBLIC_KEY" \
            -o "$output" .

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  build-wails-macos:
    name: Build Wails macOS desktop
    needs: verify
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install pinned Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Build universal Wails app
        run: |
          make web
          cd cmd/desktop
          "$(go env GOPATH)/bin/wails" build -clean -platform darwin/universal
          cd build/bin
          zip -r "../../../bob-gemini-free-desktop-darwin-universal.zip" bob-gemini-free-wails.app

      - name: Upload Wails macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: wails-darwin-universal
          path: bob-gemini-free-desktop-darwin-universal.zip
          if-no-files-found: error

  build-wails-windows:
    name: Build Wails Windows desktop
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install pinned Wails CLI
        shell: pwsh
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Build Wails Windows app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force web | Out-Null
          Copy-Item internal/server/playground.html web/index.html
          Set-Location cmd/desktop
          & "$(go env GOPATH)/bin/wails.exe" build -clean -platform windows/amd64
          Copy-Item build/bin/bob-gemini-free-wails.exe ../../bob-gemini-free-desktop-windows-amd64.exe

      - name: Upload Wails Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: wails-windows-amd64
          path: bob-gemini-free-desktop-windows-amd64.exe
          if-no-files-found: error

  publish:
    name: Publish signed release
    needs: [build-cli, build-wails-macos, build-wails-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create signed SHA256 manifest
        env:
          BOB_GEMINI_FREE_UPDATE_PRIVATE_KEY: ${{ secrets.BOB_GEMINI_FREE_UPDATE_PRIVATE_KEY }}
          BOB_GEMINI_FREE_UPDATE_PUBLIC_KEY: ${{ vars.BOB_GEMINI_FREE_UPDATE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          test -n "$BOB_GEMINI_FREE_UPDATE_PRIVATE_KEY"
          test -n "$BOB_GEMINI_FREE_UPDATE_PUBLIC_KEY"
          go run ./cmd/release-manifest -dir release-assets -public-key "$BOB_GEMINI_FREE_UPDATE_PUBLIC_KEY"
          test -s release-assets/SHA256SUMS
          test -s release-assets/SHA256SUMS.sig

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
